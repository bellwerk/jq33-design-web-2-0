    <link rel="stylesheet" href="/assets/css/site.css?v=20260717-lato" />
    <style data-jq33-critical>
      /* Hallmark · macrostructure: Photographic · tone: atmospheric editorial · anchor hue: cobalt */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        overflow-x: clip;
        font-family: var(--font-sans);
        color: var(--cobalt);
        position: relative;
      }

      .sidebar {
        position: absolute;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: var(--space-xl);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
        top: 15vh;
        left: 5vw;
      }

      .label {
        text-transform: uppercase;
        margin-bottom: var(--space-xs);
        opacity: 0.7;
        font-size: var(--fs-label);
      }

      .content-block {
        margin-bottom: var(--space-2xl);
      }

      a {
        color: var(--cobalt);
        text-decoration: none;
        position: relative;
        transition: color var(--dur-lg) var(--ease-standard);
        cursor: pointer;
      }

      @media (hover: hover) and (pointer: fine) {
        .sidebar a:hover {
          color: var(--color-white);
        }
      }

      .nav-link {
        font-weight: 600;
        font-size: 0.85rem;
        padding: var(--space-1) 0;
      }

      .active-link {
        text-decoration: line-through;
        pointer-events: none;
        opacity: 0.5;
      }

      .work-container {
        position: relative;
        width: min(1200px, calc(100vw - 48px));
        height: 100vh;
        height: 100svh;
        overflow-y: auto;
        margin: 0 auto;
        padding: var(--space-45) 0 10vh;
        display: flex;
        flex-direction: column;
        gap: clamp(var(--space-7), 5vh, var(--space-14));
        scrollbar-width: none;
        z-index: 5;
      }

      .journal-title {
        max-width: 28ch;
        font-weight: 900;
        letter-spacing: 0;
      }

      .journal-intro {
        grid-column: 1 / -1;
        margin-bottom: var(--space-md);
      }

      .journal-intro-copy {
        max-width: 48ch;
        margin-top: var(--space-3-2);
        opacity: 0.8;
      }

      .work-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(var(--space-4-5), 3vw, var(--space-9));
      }

      .work-container::-webkit-scrollbar {
        display: none;
      }

      .project-card {
        position: relative;
        aspect-ratio: 4/3;
        background-color: var(--color-deep-charcoal);
        overflow: hidden;
        border: 1px solid var(--color-white-a12);
        transition: border-color var(--dur-lg) var(--ease-standard);
      }

      @media (hover: hover) and (pointer: fine) {
        .project-card:hover {
          border-color: var(--cobalt);
        }
      }

      .project-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%) brightness(0.6) contrast(1.2);
      }

      .project-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: var(--space-7-5);
        background: linear-gradient(
          0deg,
          var(--color-black-a80) 0%,
          var(--color-black-a00) 50%
        );
      }

      .project-title {
        font-size: var(--fs-h2);
        line-height: 1.02;
        font-weight: 900;
        letter-spacing: 0;
        margin-bottom: var(--space-xs);
        color: var(--cobalt);
      }

      .project-meta {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--color-white-a72);
        opacity: 1;
      }

      .project-number {
        position: absolute;
        top: var(--space-xl);
        right: var(--space-xl);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-subtle);
        opacity: 1;
      }

      @media (max-width: 1024px) {
        .work-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 900px) {
        .sidebar {
          display: none;
        }

        .work-container {
          width: calc(100% - 32px);
          height: auto;
          min-height: 100vh;
          min-height: 100svh;
          overflow: visible;
          padding: var(--space-31) 0 var(--space-18);
        }
      }

      @media (max-width: 640px) {
        .project-overlay {
          padding: var(--space-4-5);
        }

        .project-meta {
          letter-spacing: 1px;
        }

        .project-title {
          font-size: var(--fs-h2);
        }

        .project-number {
          display: none;
        }
      }
    </style>
  </head>
  <body class="site-default-bg">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="header-nav" data-component="header-nav"></header>

    <aside class="sidebar">
      <div class="content-block">
        <div class="label">JQ33 DESIGN</div>
        <div>Commercial Interior Design (Montreal)</div>
      </div>
    </aside>

    <main class="work-container" id="main-content">
      <div class="work-grid">
        <section class="journal-intro">
          <h1 class="journal-title">
            Journal: Design decisions that pay off
          </h1>
          <p class="journal-intro-copy">
            Short reads on the choices that make a space feel premium-and build smoothly.
          </p>
        </section>
        {{post_cards}}
      </div>

      <footer class="site-footer" data-component="footer"></footer>
    </main>

    <script src="/assets/js/deferred-css.js"></script>
    <script src="/assets/js/calendly.js"></script>
    <script src="/assets/js/components/header-nav.js"></script>
    <script src="/assets/js/components/footer.js?v=20260716-1"></script>
    <script src="/assets/js/nav-drawer.js"></script>
    <script>
      const canHover =
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const container = document.querySelector(".work-container");

      if (canHover && container) {
        container.addEventListener("scroll", () => {
          const cards = document.querySelectorAll(".project-card");
          cards.forEach((card, index) => {
            const speed = 0.05 * (index % 2 === 0 ? 1 : -1);
            const rect = card.getBoundingClientRect();
            const offset = (window.innerHeight / 2 - rect.top) * speed;
            card.querySelector(
              ".project-image"
            ).style.transform = `translateY(${offset}px) scale(1.1)`;
          });
        });
      }
    </script>
  </body>
</html>
