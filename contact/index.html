    <style>
      /* Hallmark · macrostructure: Photographic · tone: atmospheric editorial · anchor hue: cobalt */
      :root {
        --split-point: 50%;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        overflow-x: clip;
        background-color: var(--color-white);
        font-family: var(--font-sans);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }

      .contact-layout {
        display: flex;
        flex: 1 1 auto;
        min-height: 100vh;
        min-height: 100svh;
      }

      .left-panel {
        width: var(--split-point);
        height: 100%;
        background-color: var(--color-white);
        color-scheme: light;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: clamp(var(--space-28), 10%, var(--space-38)) 8%;
        z-index: 2;
        position: relative;
      }

      .left-panel__content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1 1 auto;
      }

      .right-panel {
        width: calc(100% - var(--split-point));
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .headline {
        margin-bottom: var(--space-7);
        color: var(--ink);
      }

      .page-intro {
        max-width: 48ch;
        font-size: 1rem;
        line-height: 1.65;
        color: var(--text-on-light-muted);
        margin-bottom: var(--space-9);
      }

      .capture-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
        max-width: 480px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .input-group label {
        font-size: 0.75rem;
        text-transform: uppercase;
        font-weight: 750;
        letter-spacing: 0.12em;
        color: var(--cobalt);
      }

      .input-group input,
      .input-group select,
      .input-group textarea {
        border: none;
        border-bottom: 1px solid var(--color-deep-charcoal-a22);
        padding: var(--space-3-6) 0;
        font-family: var(--font-sans);
        font-size: 0.98rem;
        line-height: 1.45;
        outline: 2px solid transparent;
        outline-offset: 1px;
        color: var(--ink);
        transition: border-color var(--dur-lg) var(--ease-standard),
          background-color var(--dur-lg) var(--ease-standard);
        background: transparent;
      }

      .input-group input:focus,
      .input-group select:focus,
      .input-group textarea:focus {
        border-color: var(--cobalt);
      }

      .input-group input:focus-visible,
      .input-group select:focus-visible,
      .input-group textarea:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
        border-color: var(--cobalt);
      }

      .input-group input:disabled,
      .input-group select:disabled,
      .input-group textarea:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .cta-button {
        margin-top: var(--space-md);
        background-color: var(--color-accent);
        color: var(--color-accent-ink);
        border: 1px solid var(--color-accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-4-2) var(--space-5-8);
        font-family: var(--font-sans);
        font-weight: 800;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color var(--dur-lg) var(--ease-standard),
          transform var(--dur-sm) var(--ease-standard),
          border-color var(--dur-lg) var(--ease-standard);
        text-align: center;
        text-decoration: none;
        width: fit-content;
      }

      .cta-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .hp-field {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border: 0;
        white-space: nowrap;
      }

      .form-status {
        margin-top: var(--space-xs);
        color: var(--color-success-ink);
        font-size: 0.9rem;
        min-height: 1.4em;
      }

      .form-status.is-error {
        color: var(--color-error-ink);
      }

      .form-status.is-success {
        color: var(--color-success-ink);
      }

      .field-error {
        color: var(--color-error-ink);
      }

      .bg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: none;
        background-size: cover;
        background-position: center;
        filter: grayscale(20%) contrast(110%);
      }

      .brand-mark {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translate(-50%, -50%) rotate(-90deg);
        font-family: var(--font-display);
        font-size: clamp(70px, 20vh, 230px);
        color: var(--cobalt);
        white-space: nowrap;
        z-index: 3;
        pointer-events: none;
        opacity: var(--decorative-brand-opacity);
        line-height: 1;
        text-shadow: 0px 0px 20px var(--color-cobalt-a20);
      }

      .grain {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        z-index: 4;
      }

      .nav-header {
        position: absolute;
        top: var(--space-2xl);
        left: 8%;
        z-index: 10;
      }

      .nav-label {
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--cobalt);
        font-weight: 600;
      }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3-5);
        margin-top: var(--space-3-5);
      }

      .site-nav a {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
        opacity: 0.8;
        transition: color var(--dur-sm) var(--ease-standard);
      }

      .site-nav a[aria-current="page"] {
        opacity: 1;
        color: var(--cobalt);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      @media (hover: hover) and (pointer: fine) {
        .cta-button:hover {
          background-color: var(--cobalt-base-hover);
        }

        .site-nav a:hover {
          color: var(--cobalt);
        }
      }

      @media (max-width: 900px) {
        .contact-layout {
          flex-direction: column;
        }

        .left-panel {
          width: 100%;
          height: auto;
          justify-content: flex-start;
          padding: var(--space-28) max(var(--space-lg), 8%) 12%;
        }

        .right-panel {
          width: 100%;
          height: 42vh;
          min-height: 240px;
        }

        .right-panel .brand-mark {
          left: 50%;
          transform: translate(-50%, -50%) rotate(-90deg);
          font-size: clamp(56px, 14vh, 130px);
          opacity: 0.18;
        }
      }

      @media (max-width: 640px) {
        .nav-header {
          top: var(--space-md);
          left: var(--space-md);
          right: var(--space-md);
        }

        .capture-form {
          max-width: 100%;
        }

        .cta-button {
          width: 100%;
          text-align: center;
        }
      }

      @media (max-width: 520px) {
        .headline {
          margin-bottom: var(--space-xl);
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="header-nav" data-component="header-nav"></header>
    <div class="nav-header">
      <div class="nav-label">JQ33 DESIGN (Montreal)</div>
    </div>
    <main class="contact-layout" id="main-content">
      <div class="left-panel">
        <div class="left-panel__content">
          <h1 class="headline">
            Commercial Interior Design<br />in Montreal
          </h1>

          <p class="page-intro">
            Tell us about your space, timing, and project goals.
          </p>

          <form
            class="capture-form"
            data-lead-form="contact"
            method="post"
            action="{{FORMSPREE_CONTACT_URL}}"
            accept-charset="UTF-8"
          >
            <input type="hidden" name="form_type" value="contact" />
            <input type="hidden" name="source_path" value="/contact/" />
            <input type="hidden" name="_subject" value="JQ33 Contact request" />
            <div class="hp-field" aria-hidden="true">
              <label for="contact-company">Company</label>
              <input
                type="text"
                id="contact-company"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
              />
            </div>
            <div class="input-group">
              <label for="contact-name">Name</label>
              <input
                type="text"
                id="contact-name"
                name="name"
                placeholder="Your name"
                autocomplete="name"
                maxlength="120"
                required
                aria-describedby="contact-name-error"
              />
              <p class="field-error" id="contact-name-error" data-field-error aria-live="polite"></p>
            </div>
            <div class="input-group">
              <label for="contact-email">Email</label>
              <input
                type="email"
                id="contact-email"
                name="email"
                placeholder="you@business.com"
                autocomplete="email"
                maxlength="254"
                required
                aria-describedby="contact-email-error"
              />
              <p class="field-error" id="contact-email-error" data-field-error aria-live="polite"></p>
            </div>
            <div class="input-group">
              <label for="contact-project-type">Project Type</label>
              <select
                id="contact-project-type"
                name="project_type"
                required
                aria-describedby="contact-project-type-error"
              >
                <option value="" selected disabled>Select project type</option>
                <option value="coffee-shop-cafe">Coffee shop / cafe</option>
                <option value="salon-beauty-studio">Salon / beauty studio</option>
                <option value="clinic-wellness">Clinic / wellness</option>
                <option value="retail-boutique">Retail / boutique</option>
                <option value="small-office">Small office</option>
                <option value="other">Other</option>
              </select>
              <p
                class="field-error"
                id="contact-project-type-error"
                data-field-error
                aria-live="polite"
              ></p>
            </div>
            <div class="input-group">
              <label for="contact-message">Project details</label>
              <textarea
                id="contact-message"
                name="message"
                rows="4"
                placeholder="Tell us about your space, timeline, and goals."
                maxlength="2000"
                required
                aria-describedby="contact-message-error"
              ></textarea>
              <p class="field-error" id="contact-message-error" data-field-error aria-live="polite"></p>
            </div>
            <button type="submit" class="cta-button">Get a quote</button>
            <p
              class="form-status"
              data-form-status
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></p>
            <button
              class="cta-button cta-button--secondary"
              type="button"
              data-form-retry
              hidden
            >
              Retry
            </button>
            <a
              class="cta-button"
              href="{{CALENDLY_URL}}"
              data-calendly-cta
              target="_blank"
              rel="noopener noreferrer"
              >Book a call</a
            >
          </form>
        </div>
      </div>

      <div class="right-panel">
        <div class="bg-layer" id="parallax-bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
        <div class="brand-mark" aria-hidden="true">JQ33<br />DESIGN</div>
      </div>
    </main>

    <footer class="site-footer site-footer--stacked" data-component="footer"></footer>

    <script src="/assets/js/leads.js"></script>
    <script src="/assets/js/calendly.js"></script>
    <script src="/assets/js/components/header-nav.js"></script>
    <script src="/assets/js/components/footer.js?v=20260716-1"></script>
    <script src="/assets/js/nav-drawer.js"></script>
  </body>
</html>
