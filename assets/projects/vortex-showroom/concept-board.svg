<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Vortex Showroom concept board</title>
  <desc id="desc">An illustrative showroom diagram with a charcoal demonstration core, cobalt radial guides, and adaptable perimeter bays.</desc>
  <rect width="1200" height="630" fill="#f6f5f0"/>
  <rect x="45" y="44" width="1110" height="542" fill="none" stroke="#17191d" stroke-width="4"/>
  <circle cx="665" cy="315" r="224" fill="none" stroke="#d8d7d1" stroke-width="88"/>
  <circle cx="665" cy="315" r="144" fill="#17191d"/>
  <circle cx="665" cy="315" r="72" fill="#3b41e3"/>
  <g stroke="#3b41e3" stroke-width="5">
    <line x1="665" y1="315" x2="665" y2="71"/>
    <line x1="665" y1="315" x2="876" y2="193"/>
    <line x1="665" y1="315" x2="876" y2="437"/>
    <line x1="665" y1="315" x2="665" y2="559"/>
    <line x1="665" y1="315" x2="454" y2="437"/>
    <line x1="665" y1="315" x2="454" y2="193"/>
  </g>
  <g fill="#17191d">
    <rect x="548" y="66" width="234" height="46"/>
    <rect x="854" y="142" width="170" height="46" transform="rotate(30 939 165)"/>
    <rect x="854" y="442" width="170" height="46" transform="rotate(-30 939 465)"/>
    <rect x="548" y="518" width="234" height="46"/>
    <rect x="306" y="442" width="170" height="46" transform="rotate(30 391 465)"/>
    <rect x="306" y="142" width="170" height="46" transform="rotate(-30 391 165)"/>
  </g>
  <rect x="75" y="77" width="204" height="172" fill="#3b41e3"/>
  <text x="100" y="124" fill="#f6f5f0" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">VORTEX</text>
  <text x="100" y="158" fill="#f6f5f0" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">SHOWROOM</text>
  <line x1="100" y1="183" x2="247" y2="183" stroke="#f6f5f0" stroke-width="2"/>
  <text x="100" y="211" fill="#e2e1ff" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">DEMO LOOP / BAY</text>
  <text x="77" y="550" fill="#555861" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">ILLUSTRATIVE CONCEPT BOARD 04</text>
